# ============================================================================
# INTEGRATION CHARACTERISTICS
# ============================================================================

integration_characteristics:
  integration_type: device
  iot_class: local_push
  
  platforms:
    - platform: sensor
      entities: "status + dynamic PID sensors"
      state_class: "measurement"
      
    - platform: binary_sensor
      entities: "BLE, ECU, Sleep, VPN status"
      device_class: "connectivity"
      
  communication:
    protocol: "HTTP webhooks"
    direction: "push from device"
    local: true
    cloud: false
    
  discovery:
    method: "Zeroconf mDNS"
    service_type: "_wican._tcp.local"
    fallback: "_http._tcp.local (legacy firmware)"
    automatic: true
    confirmation: "required after onboarding"
    
  reliability:
    coordinator: "DataUpdateCoordinator with push updates"
    fallback: "Polling every 5 minutes if no webhook"
    retry_logic: "Exponential backoff with 3 retries"
    ip_caching: "5-minute cache for mDNS resolution"
    
  requirements:
    firmware: "v2.00+ recommended (MAC-based discovery)"
    network: "Local network access"
    ports: "HTTP (device web interface)"

